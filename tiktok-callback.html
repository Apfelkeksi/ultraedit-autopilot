<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UltraEdit Autopilot: TikTok login</title><style>body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#1a1a1a;background:#fff}code{display:block;word-break:break-all;background:#f1f3f4;padding:14px;border-radius:8px;font-size:18px}button{margin-top:12px;font-size:18px;padding:10px 18px;border-radius:8px;border:0;background:#0b57d0;color:#fff;cursor:pointer}footer{margin-top:40px;padding-top:12px;border-top:1px solid #ddd;font-size:.9em}</style></head><body>
<h1>TikTok-Anmeldung</h1>
<p id="msg">Kopiere diesen Code und füge ihn im schwarzen Fenster ein:</p>
<code id="code">…</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent);this.textContent='Kopiert ✓'">Code kopieren</button>
